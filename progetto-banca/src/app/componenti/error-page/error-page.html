<div class="error-page">
  <h1 class="error-page__title">Qualcosa non ha funzionato</h1>
  <p class="error-page__message" role="alert">{{ message() }}</p>
  @if (isAuthContext()) {
    <button type="button" class="error-page__btn" (click)="goLogin()">Torna al login</button>
  } @else {
    <button type="button" class="error-page__btn" (click)="goHome()">Torna alla Home</button>
  }
</div>
