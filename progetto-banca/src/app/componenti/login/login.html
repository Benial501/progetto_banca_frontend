<div class="auth-shell">
  <div class="auth-toolbar">
    <button type="button" class="theme-toggle-auth" (click)="theme.toggle()" aria-label="Cambia tema chiaro o scuro">
      {{ theme.isDark() ? '☀️' : '🌙' }}
    </button>
  </div>

  <div class="auth-panel">
    <div class="auth-card">
      <h1>Accedi</h1>
      <p class="auth-lead">Inserisci il numero del tuo conto per accedere.</p>

      @if (error) {
        <p class="auth-error" role="alert">{{ error }}</p>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="login-account">Numero conto</label>
          <input
            id="login-account"
            type="number"
            name="accountNumber"
            [(ngModel)]="accountNumber"
            required
            min="1"
            step="1"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Es. 1"
          />
        </div>
        <button type="submit" class="btn btn-primary auth-submit" [disabled]="loading">
          {{ loading ? 'Accesso…' : 'Entra' }}
        </button>
      </form>

      <p class="auth-switch">
        Non hai un account?
        <a routerLink="/registrazione">Registrati</a>
      </p>
    </div>
  </div>
</div>
