<div class="auth-shell">
  <div class="auth-toolbar">
    <button type="button" class="theme-toggle-auth" (click)="theme.toggle()" aria-label="Cambia tema chiaro o scuro">
      {{ theme.isDark() ? 'Giorno' : 'Notte' }}
    </button>
  </div>

  <div class="auth-panel">
    <div class="auth-card">
      <h1>Crea account</h1>
      <p class="auth-lead">Registrati per accedere alla tua area riservata.</p>

      @if (error) {
        <p class="auth-error" role="alert">{{ error }}</p>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="reg-name">Nome e cognome</label>
          <input
            id="reg-name"
            type="text"
            name="displayName"
            [(ngModel)]="displayName"
            required
            autocomplete="name"
            placeholder="Mario Rossi"
          />
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input
            id="reg-email"
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            autocomplete="email"
            placeholder="nome@esempio.it"
          />
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input
            id="reg-password"
            type="password"
            name="password"
            [(ngModel)]="password"
            required
            minlength="6"
            autocomplete="new-password"
          />
        </div>
        <div class="form-group">
          <label for="reg-confirm">Conferma password</label>
          <input
            id="reg-confirm"
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            autocomplete="new-password"
          />
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Registrati</button>
      </form>

      <p class="auth-switch">
        Hai già un account?
        <a routerLink="/login">Accedi</a>
      </p>
    </div>
  </div>
</div>
