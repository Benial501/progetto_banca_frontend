<div class="auth-shell">
  <div class="auth-toolbar">
    <button type="button" class="theme-toggle-auth" (click)="theme.toggle()" aria-label="Cambia tema chiaro o scuro">
      {{ theme.isDark() ? '☀️' : '🌙' }}
    </button>
  </div>

  <div class="auth-panel">
    <div class="auth-card">
      <h1>Crea account</h1>
      <p class="auth-lead">
        Inserisci <strong>nome</strong> e <strong>valuta</strong> del conto: il sistema creerà un nuovo conto con un numero univoco.
      </p>

      @if (error) {
        <p class="auth-error" role="alert">{{ error }}</p>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="reg-name">Nome intestatario</label>
          <input
            id="reg-name"
            type="text"
            name="displayName"
            [(ngModel)]="displayName"
            required
            autocomplete="name"
            placeholder="Mario Rossi"
          />
        </div>
        <div class="form-group">
          <label for="reg-valuta">Valuta del conto</label>
          <select id="reg-valuta" name="valuta" [(ngModel)]="valuta" required>
            @for (v of valute; track v) {
              <option [value]="v">{{ v }}</option>
            }
          </select>
          <p class="auth-field-hint">La valuta definisce in quale moneta verranno registrati i movimenti.</p>
        </div>
        <button type="submit" class="btn btn-primary auth-submit" [disabled]="loading">
          {{ loading ? 'Registrazione…' : 'Registrati' }}
        </button>
      </form>

      <p class="auth-switch">
        Hai già un account?
        <a routerLink="/login">Accedi con il numero conto</a>
      </p>
    </div>
  </div>
</div>
