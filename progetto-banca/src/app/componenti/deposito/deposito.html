<div class="deposito-container">
  <div class="deposito-form">
    <h2>💰 Effettua un Deposito</h2>
    <div class="form-group">
      <label for="importo">Importo da depositare (€):</label>
      <input type="number" id="importo" [(ngModel)]="importo" placeholder="0.00" min="0.01" step="0.01">
    </div>
    <div class="form-group">
      <label for="metodo">Metodo di pagamento:</label>
      <select id="metodo" [(ngModel)]="metodo">
        <option value="carta">Carta di Credito</option>
        <option value="bonifico">Bonifico Bancario</option>
        <option value="paypal">PayPal</option>
      </select>
    </div>
    <button class="btn btn-primary" (click)="onSubmit()">Conferma Deposito</button>
  </div>
</div>
