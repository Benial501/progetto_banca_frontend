<div class="saldo-container">
  <h2>📊 Il Tuo Saldo</h2>
  <div class="saldo-card">
    <div class="saldo-amount">
      <span class="currency">€</span>
      <span class="amount">{{ saldo | number:'1.2-2' }}</span>
    </div>
    <div class="saldo-details">
      <div class="detail-item">
        <span class="label">Disponibile:</span>
        <span class="value">€ {{ saldo | number:'1.2-2' }}</span>
      </div>
      <div class="detail-item">
        <span class="label">In sospeso:</span>
        <span class="value">€ 0.00</span>
      </div>
      <div class="detail-item">
        <span class="label">Limite scoperto:</span>
        <span class="value">€ 500.00</span>
      </div>
    </div>
  </div>
  <div class="saldo-actions">
    <button class="btn btn-secondary" (click)="onAggiorna()">Aggiorna Saldo</button>
    <button class="btn btn-secondary" (click)="onEstrattoConto()">Estratto Conto</button>
  </div>
</div>
