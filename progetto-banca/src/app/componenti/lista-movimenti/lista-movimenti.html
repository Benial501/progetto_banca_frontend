<div class="movimenti-container">
  <h2>Lista movimenti</h2>

  <div class="filtri-moderni">
    <div class="filtri-moderni__block">
      <span class="filtri-moderni__label">Periodo</span>
      <div class="filtri-moderni__segment" role="group" aria-label="Filtra per periodo">
        @for (opt of periodoOptions; track opt.value) {
          <button
            type="button"
            class="filtri-moderni__chip"
            [class.filtri-moderni__chip--active]="periodo() === opt.value"
            (click)="setPeriodo(opt.value)"
          >
            {{ opt.label }}
          </button>
        }
      </div>
    </div>

    <div class="filtri-moderni__block">
      <span class="filtri-moderni__label">Tipo</span>
      <div class="filtri-moderni__segment" role="group" aria-label="Filtra per tipo movimento">
        @for (opt of tipoOptions; track opt.value) {
          <button
            type="button"
            class="filtri-moderni__chip"
            [class.filtri-moderni__chip--active]="tipo() === opt.value"
            (click)="setTipo(opt.value)"
          >
            {{ opt.label }}
          </button>
        }
      </div>
    </div>
  </div>

  @if (banking.transazioniLoading()) {
    <p class="movimenti-loading">Caricamento movimenti…</p>
  }

  <div class="movimenti-list">
    <div
      class="movimento-item"
      *ngFor="let trans of transazioniFiltrate()"
      [ngClass]="{
        'entrata': trans.tipo === 'deposito',
        'uscita': trans.tipo === 'prelievo'
      }"
      [routerLink]="['/transazioni', trans.id]"
    >
      <div class="movimento-info">
        <div class="movimento-descrizione">
          {{ trans.descrizione }}
        </div>
        <div class="movimento-data">
          {{ trans.data | date: 'dd/MM/yyyy' }}
        </div>
      </div>

      <div class="movimento-importo">
        {{ trans.importo | number: '1.2-2' }} €
      </div>
    </div>
  </div>
</div>
