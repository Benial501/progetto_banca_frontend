<div class="movimenti-container">
  <h2>📋 Lista Movimenti</h2>

  <div class="filtri">
    <div class="filtro-group">
      <label for="periodo">Periodo:</label>
      <select id="periodo" [(ngModel)]="periodo" (change)="onFiltroChange()">
        <option value="oggi">Oggi</option>
        <option value="settimana">Questa settimana</option>
        <option value="mese">Questo mese</option>
        <option value="anno">Quest'anno</option>
      </select>
    </div>

    <div class="filtro-group">
      <label for="tipo">Tipo:</label>
      <select id="tipo" [(ngModel)]="tipo" (change)="onFiltroChange()">
        <option value="tutti">Tutti</option>
        <option value="entrata">Entrate</option>
        <option value="uscita">Uscite</option>
      </select>
    </div>
  </div>

  <div class="movimenti-list">
    <div
      class="movimento-item"
      *ngFor="let trans of transazioniFiltrate"
      [ngClass]="{
        'entrata': trans.tipo === 'deposito',
        'uscita': trans.tipo === 'prelievo'
      }"
      [routerLink]="['/transazioni', trans.id]"
    >
      <div class="movimento-info">
        <div class="movimento-descrizione">
          {{ trans.descrizione }}
        </div>
        <div class="movimento-data">
          {{ trans.data | date:'dd/MM/yyyy' }}
        </div>
      </div>

      <div class="movimento-importo">
        {{ trans.importo | number:'1.2-2' }} €
      </div>
    </div>
  </div>
</div>
