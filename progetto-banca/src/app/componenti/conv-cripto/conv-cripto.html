<div class="cripto-container">
  <h2>₿ Conversione Criptovalute</h2>

  <div class="saldo-info">
    <p>
      Il tuo saldo attuale:
      <strong>{{ getSimboloValuta('EUR') }} {{ formattaNumero(saldoAttuale) }}</strong>
    </p>
  </div>

  <div class="cripto-form">
    <div class="form-group">
      <label for="a-cripto">Visualizza saldo convertito in:</label>
      <select id="a-cripto" [(ngModel)]="aValuta" (change)="onValutaTargetChange()">
        <option value="EUR">EUR - Euro</option>
        <option value="USD">USD - Dollaro USA</option>
        <option value="GBP">GBP - Sterlina</option>
        <option value="JPY">JPY - Yen</option>
        <option value="BTC">BTC - Bitcoin</option>
        <option value="ETH">ETH - Ethereum</option>
        <option value="BNB">BNB - Binance Coin</option>
        <option value="ADA">ADA - Cardano</option>
      </select>
    </div>

    <div class="risultato">
      <div class="totale-fiat" *ngIf="aValuta in tassiFiat">
        Saldo convertito:
        <span>{{ getSimboloValuta(aValuta) }} {{ formattaNumero(saldoConvertito) }}</span>
      </div>
      <div class="equivalente-cripto" *ngIf="!(aValuta in tassiFiat)">
        Saldo convertito:
        <span>{{ formattaNumero(saldoConvertito, 6) }} {{ aValuta }}</span>
      </div>
    </div>
  </div>
</div>
