<div class="prelievo-container">
  <div class="prelievo-form">
    <h2>Effettua un prelievo</h2>
    <p class="prelievo-hint">L’importo viene addebitato sulla tua carta conto.</p>

    @if (feedback()) {
      <p class="prelievo-feedback prelievo-feedback--error" role="alert">{{ feedback() }}</p>
    }

    <div class="form-group">
      <label for="importo-prelievo">Importo da prelevare (€):</label>
      <input type="number" id="importo-prelievo" [(ngModel)]="importo" placeholder="0.00" min="0.01" step="0.01" />
    </div>
    <div class="form-group">
      <label for="causale">Causale:</label>
      <input type="text" id="causale" [(ngModel)]="causale" placeholder="Es. spese varie" />
    </div>
    <p class="prelievo-saldo-hint">Saldo disponibile: € {{ saldoConto() | number: '1.2-2' }}</p>
    <button type="button" class="btn btn-danger" (click)="onSubmit()">Conferma prelievo</button>
  </div>
</div>
